name: WinSplits-import

# Startar av sig själv när txt-filer läggs i eventor/winsplits/ på main,
# och kan också startas för hand. Gör inga anrop till Eventor.
on:
  push:
    branches: [main]
    paths: ["eventor/winsplits/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eventor
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importera
        run: python eventor/import_winsplits.py
      - name: Spara resultaten i repot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventor/data
          if git diff --cached --quiet; then
            echo "Inget nytt att spara."
          else
            git commit -m "WinSplits-data $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
