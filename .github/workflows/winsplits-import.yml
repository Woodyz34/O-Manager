name: WinSplits-import

# Startar av sig själv när txt-filer läggs i eventor/winsplits/ på main, eller när
# eventor/klubbar.txt eller eventor/nationalitet.txt ändras,
# och kan också startas för hand. Gör inga anrop till Eventor.
on:
  push:
    branches: [main]
    paths: ["eventor/winsplits/**", "eventor/import_winsplits.py", "eventor/klubbar.txt", "eventor/nationalitet.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winsplits
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importera
        run: python eventor/import_winsplits.py
      - name: Räkna poäng
        run: python eventor/compute_points.py
      - name: Spara resultaten i repot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventor/data eventor/klubbar.txt eventor/nationalitet.txt Assets/Resources/Runners Assets/Resources/Emblem/Bildlista.txt
          if git diff --cached --quiet; then
            echo "Inget nytt att spara."
          else
            git commit -m "WinSplits-data $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
