name: Eventor resultat

# Startas bara för hand (Actions -> Eventor resultat -> Run workflow).
# once = engångsjobbet (senaste året, nivå 1 utan DM + Swedish League/WRE)
# week = senaste veckan (nivå 1, 2 och internationellt)
# Ett anrop för listan + ett per etapp, med 20 s paus mellan anropen.
# Etapper som redan finns i eventor/data/races hämtas inte igen.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "once = senaste året, week = senaste veckan"
        type: choice
        options: [once, week]
        default: once

permissions:
  contents: write

concurrency:
  group: eventor
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta resultat
        env:
          EVENTOR_API_KEY: ${{ secrets.EVENTOR_API_KEY }}
        run: python eventor/fetch_results.py --mode "${{ inputs.mode }}"
      - name: Spara resultaten i repot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventor/data
          if git diff --cached --quiet; then
            echo "Inget nytt att spara."
          else
            git commit -m "Eventor-data: ${{ inputs.mode }} $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
      - name: Spara råsvaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventor-raw-${{ inputs.mode }}
          path: eventor/cache/
          if-no-files-found: ignore
          retention-days: 90
